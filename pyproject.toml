[project]
name = "supertonic-proxy"
version = "0.2.0"
description = "Thin proxy for supertonic serve with ffmpeg audio conversion (opus/mp3/aac)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.scripts]
supertonic-proxy = "supertonic_proxy.main:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
