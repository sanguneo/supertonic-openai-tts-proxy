[project]
name = "supertonic-openai-tts-proxy"
version = "0.1.0"
description = "OpenAI-compatible local TTS proxy backed by Supertonic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "supertonic>=0.1.0",
    "numpy>=1.26.0,<2.0",
    "soundfile>=0.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "pytest-asyncio>=0.25.0",
]

[project.scripts]
supertonic-openai-tts-proxy = "supertonic_openai_tts_proxy.main:run"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
